version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # aiohttp 3.14+ cannot be adopted until aioresponses supports it - see the cap in
      # pyproject.toml. Without this, every run reopens a PR whose tests can never pass
      # (and grouping drags otherwise-fine dev bumps down with it).
      - dependency-name: aiohttp
        versions: [">=3.14"]
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
