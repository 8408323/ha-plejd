[project]
name = "ha-plejd"
version = "0.14.1"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "voluptuous>=0.16.0",
    "bleak>=3.1.0",
    "bleak-retry-connector>=4.7.1",
    "cryptography>=50.0.2",
    # aiohttp is dev/test-only here (project dependencies and manifest requirements are both
    # empty) - at runtime the integration uses Home Assistant's own aiohttp. 3.14.4+ carries
    # the security fixes. aioresponses 0.7.9 does not pass aiohttp 3.14's new required
    # `stream_writer` kwarg (pnuckowski/aioresponses#288); tests/conftest.py shims that
    # until an aioresponses release does.
    "aiohttp>=3.14.5",
    "aioresponses>=0.7.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
