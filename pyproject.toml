[project]
name = "ha-plejd"
version = "0.9.0"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "voluptuous>=0.16.0",
    "bleak>=3.0.2",
    "bleak-retry-connector>=4.6.1",
    "cryptography>=49.0.0",
    "aiohttp>=3.13.5,<3.14",
    "aioresponses>=0.7.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
